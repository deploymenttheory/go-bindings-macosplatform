name: Acceptance Tests

on:
  push:
    branches: [main]
    paths:
      - 'bindings/**'
      - 'cmd/genacceptance/**'
      - 'cmd/generate/**'
      - 'cmd/gensymbolgate/**'
      - 'examples/**'
      - 'internal/**'
      - 'metadata/**'
      - 'opinionated/**'
      - 'scripts/ci/**'
      - 'scripts/tools/**'
      - '.github/workflows/acceptance.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'bindings/**'
      - 'cmd/genacceptance/**'
      - 'cmd/generate/**'
      - 'cmd/gensymbolgate/**'
      - 'examples/**'
      - 'internal/**'
      - 'metadata/**'
      - 'opinionated/**'
      - 'scripts/ci/**'
      - 'scripts/tools/**'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:
    inputs:
      n:
        description: 'Number of functions to sample'
        default: '100'
        required: false
        type: string
      seed:
        description: 'Hex sample seed (0 = time-based, non-zero for reproducible run)'
        default: '2700'
        required: false
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: 'Acceptance Tests (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, xcode-27]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Detect macOS version
        id: version
        run: go run ./scripts/ci/macosversion/

      - name: Require macOS 27
        if: matrix.os == 'xcode-27'
        env:
          MACOS_MAJOR: ${{ steps.version.outputs.macos_major }}
        run: |
          if [ "$MACOS_MAJOR" != '27' ]; then
            echo "::error::SDK 27 acceptance tests require macOS 27; found $MACOS_MAJOR."
            exit 1
          fi

      - name: Report live-test eligibility
        if: steps.version.outputs.macos_major < 27
        run: echo 'Live SDK 27 tests require macOS 27+. This job runs generator, metadata, build, vet, and parity checks; xcode-27 supplies live coverage.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: go test ./internal/... ./scripts/tools/... ./scripts/ci/...

      # Structural integrity gate over the committed metadata artifact:
      # dangling superclasses, ownership ties, enum base-type conflicts,
      # availability anomalies, mixed-SDK trees. Errors fail; warnings report.
      - name: Validate committed metadata
        run: go run ./cmd/generate/ validate

      # Ratchet: regeneration must not introduce type degradations beyond the
      # committed baseline. Fixing degradations shrinks the baseline (rewrite it
      # with --diagnostics); introducing one requires a reviewed baseline edit.
      - name: Check for new unsafe.Pointer degradations (baseline ratchet)
        run: |
          go run ./cmd/generate/ bindings \
            --frameworks-out /tmp/fw-strict-check \
            --libraries-out /tmp/lib-strict-check \
            --diagnostics-baseline metadata/diagnostics-baseline.json

      # opinionated/ and examples/ are consumers of the public bindings surface;
      # building and testing them here keeps them from drifting when the
      # generated API changes (they are not covered by any other target).
      - name: Build all binding packages, opinionated tools, and examples
        # Go's ./... pattern skips underscore-prefixed package directories.
        run: CGO_ENABLED=0 go build ./bindings/... ./bindings/frameworks/_* ./bindings/internal/raw/frameworks/_* ./opinionated/... ./examples/...

      - name: Vet bindings
        run: go vet -unsafeptr=false ./bindings/... ./bindings/frameworks/_* ./bindings/internal/raw/frameworks/_*

      - name: Test generated ABI layouts
        if: steps.version.outputs.macos_major >= 27
        run: go test ./bindings/frameworks/... ./bindings/internal/raw/frameworks/... ./bindings/frameworks/_* ./bindings/internal/raw/frameworks/_* -run '^TestGeneratedLayout$' -count=1

      - name: Test runtime
        if: steps.version.outputs.macos_major >= 27
        run: go test ./bindings/runtime/... -count=1

      - name: Test opinionated tools and examples
        if: steps.version.outputs.macos_major >= 27
        run: go test ./opinionated/... ./examples/... -count=1

      # Live proof for the purego-backed C libraries: the suite must BUILD and
      # PASS with CGO_ENABLED=0 — a library that silently regressed to a cgo
      # dependency fails at compile time here.
      - name: Test purego-backed libraries (CGO_ENABLED=0)
        if: steps.version.outputs.macos_major >= 27
        run: CGO_ENABLED=0 go test ./bindings/acceptance/puregolibs/ -count=1 -v

      # Ratchet: the idiomatic public layer must keep covering every construct the
      # raw layer emits. Fails only on a NEW gap beyond the committed baseline.
      - name: Check idiomatic parity (ratchet)
        run: go run ./cmd/generate/ parity --baseline metadata/parity-baseline.json

      - name: Generate acceptance tests
        run: |
          go run ./cmd/genacceptance/ \
            --n "${{ inputs.n || '100' }}" \
            --seed "${{ inputs.seed || '2700' }}"

      - name: Run acceptance tests
        if: steps.version.outputs.macos_major >= 27
        run: |
          GENACCEPT_ATTEST="$GITHUB_WORKSPACE/acceptance-attestation.jsonl" \
          go test ./bindings/acceptance/ \
            -v \
            -timeout 600s \
            -count=1

      # Tier A — symbol-resolution gate. Regenerate from committed metadata +
      # baseline, then dlsym/objc_getClass every bound symbol against the real
      # system dylibs (no calls). Fails only on a symbol unresolved AND not in
      # metadata/symbolgate-baseline.json — i.e. a NEW binding to a nonexistent
      # symbol. Runs independently of the framework packages, so the pre-existing
      # import cycles don't gate it.
      - name: Run symbol-resolution gate
        if: steps.version.outputs.macos_major >= 27
        run: |
          go run ./cmd/gensymbolgate/
          go test ./bindings/symbolgate/ -v -timeout 300s -count=1

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: |
            acceptance-attestation.jsonl
            bindings/acceptance/generated_acceptance_test.go
          if-no-files-found: ignore
